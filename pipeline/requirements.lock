# Trans-Canada Bikeshare — pinned toolchain.
#
# Exact versions and hashes of every package the pipeline runs on, direct and
# transitive. `pipeline/requirements.txt` carries lower bounds and is what a
# refresh resolves FROM; this file is what a rebuild installs, and it is the
# one the runbook and CI use. A hash mismatch aborts the install.
#
#   python3.11 -m venv .venv
#   .venv/bin/pip install --require-hashes -r pipeline/requirements.lock
#
# **Python 3.11 only.** Every hash below is a CPython 3.11 (`cp311`) wheel, so
# another minor version has nothing to install and pip fails immediately rather
# than resolving something else. The requirement is stated once in code, in
# `common.PYTHON_REQUIRES`, and asserted on every pipeline import.
#
# Platforms covered: macOS arm64 (the machine this project is built on),
# manylinux x86_64 and manylinux aarch64 (CI runners). Pure-python wheels
# (`py3-none-any`) cover every platform with one hash. A fourth platform has to
# regenerate this file — it is not a silent fallback, it is an install failure.
#
# Regenerate (network, ~5 min):
#
#   .venv/bin/pip freeze > /tmp/frozen.txt
#   for plat in "" \
#     "--python-version 3.11 --implementation cp --abi cp311 --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux_2_28_x86_64 --platform manylinux_2_34_x86_64" \
#     "--python-version 3.11 --implementation cp --abi cp311 --platform manylinux2014_aarch64 --platform manylinux_2_17_aarch64 --platform manylinux_2_28_aarch64 --platform manylinux_2_34_aarch64"; do \
#       .venv/bin/pip download --no-deps -r /tmp/frozen.txt -d /tmp/wheels --only-binary=:all: $plat; done
#   .venv/bin/pip hash /tmp/wheels/*        # one --hash line per distribution
#
# DuckDB is pinned here and nowhere else. Its extensions are NOT in this file —
# they are binaries, they are not vendored into git, and `etl.load_extensions`
# states which ones are needed and where they come from.
#
# Generated 2026-07-31 from the working environment (pip 23.1.2, Python 3.11.4).

