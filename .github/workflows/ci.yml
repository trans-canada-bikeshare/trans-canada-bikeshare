# Trans-Canada Bikeshare — continuous integration.
#
# What a clean GitHub-hosted runner can actually prove: that the pinned
# toolchain installs, that the pipeline runs end to end over the synthetic
# fixture archive, and that the site's tests, types and build pass. It has no
# access to the ~20 GB source archive, so the full-data gates (`make check`)
# stay local and manual — see docs/runbook.md, "CI".
#
# No `continue-on-error`, no `|| true`, no soft failures. A gate that cannot
# fail is the thing this repository's Makefile header exists to prevent, and a
# workflow that reports green over a skipped step is the same mistake wearing a
# different hat.
#
# Deployment is NOT here. It is manual, it is documented in the runbook, and no
# Cloudflare credential exists in this repository's secrets.
#
# Spec 031 hardening, deferred here by name from 029's review:
#
#   * Every action is pinned to a full commit SHA with its version beside it. A
#     tag is a moving pointer the action's owner can repoint at any commit,
#     including after a compromise; a SHA is the code that was reviewed. Each
#     SHA below was resolved from the tag with `gh api
#     repos/<action>/git/ref/tags/<major>` and confirmed against the semver tag
#     pointing at the same commit — the table is in spec 031's record.
#   * `persist-credentials: false` on both checkouts. `actions/checkout` writes
#     the job's token into `.git/config` by default, where every later step —
#     including anything a dependency's install script runs — can read and push
#     with it. Nothing here pushes.
#   * `timeout-minutes` on both jobs. The gates take about two minutes; a job
#     still running at fifteen is hung, not slow, and a hung job holds a runner
#     until GitHub's six-hour default kills it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. The gates are
# deterministic, so the older run can only ever tell you about older code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 3.11 exactly. `pipeline/requirements.lock` holds CPython 3.11 (cp311)
      # wheel hashes and nothing else, and `common.require_python` asserts the
      # version at import, so anything else fails at install or at startup
      # rather than at the first behavioural difference.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock

      # --require-hashes: every distribution, direct and transitive, must match
      # a sha256 in the lock or the install aborts. This is the step that makes
      # "reproducible" mean something on a machine nobody has ever run this on.
      - name: Install the pinned toolchain
        run: pip install --require-hashes -r pipeline/requirements.lock

      - name: pytest
        run: python -m pytest pipeline/tests -q

      # The whole pipeline over the fixture archive: extract, reference, clean,
      # conform, model, publish, quality report, then check-manifest,
      # check-metrics, check-artifacts, check-report and check-reconciliation
      # against it. Offline by construction — the fixtures are CSV-only, so
      # DuckDB's `excel` extension is never needed and
      # BIKESHARE_ALLOW_EXTENSION_INSTALL=0 makes a fetch a named refusal.
      - name: make check-fixture
        run: make check-fixture PYTHON=python

  site:
    name: Site (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: vitest
        run: npm test

      - name: typecheck
        run: npm run typecheck

      # `npm run build` carries its own assertion that MapLibre's tile-parsing
      # worker reached dist/assets. Spec 021 shipped three maps that drew zero
      # dots because Rollup never emitted that chunk and the SPA fallback
      # answered the request with index.html — HTTP 200, no 404, no console
      # error. The build is a gate here, not a smoke test.
      - name: build
        run: npm run build
