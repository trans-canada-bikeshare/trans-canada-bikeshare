# Trans-Canada Bikeshare — dependency updates.
#
# Monthly, and grouped into one pull request per ecosystem. Monthly rather than
# weekly because every update here has to pass the same gates a feature does,
# and a queue of single-package PRs nobody has time to run them against is a
# queue that gets merged unread — which is worse than a slightly older
# dependency. Grouped for the same reason: one PR whose CI run means something.
#
# What a Dependabot PR must clear before it merges is in CONTRIBUTING.md. Two
# of them are specific to this repository and are easy to miss:
#
#   * `pipeline/requirements.lock` is hash-pinned and Python 3.11 only.
#     Dependabot edits `pipeline/requirements.txt` (the lower bounds); the lock
#     is REGENERATED by hand for all three platforms, per the instructions in
#     its own header. A lock edited any other way fails
#     `pip install --require-hashes` on the next clean install.
#   * `github-actions` updates arrive as a SHA change with the version comment
#     beside it. Both must move together, and the SHA must be the one the tag
#     points at — see .github/workflows/ci.yml.

version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns:
          - "*"

  # `pipeline/requirements.txt` — the lower bounds. The hash-pinned
  # `requirements.lock` beside it is regenerated by a maintainer, not by
  # Dependabot; see the note above.
  - package-ecosystem: pip
    directory: "/pipeline"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
